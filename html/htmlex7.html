<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>html태그연습</title>
</head>
<body>
  <h2>HTML 특수문자 예제</h2>
  <p>여기에는 다양한 HTML 특수문자가 사용되었습니다.</p>
  <ul>
    <li>작은 따옴표:&apos;</li>
    <li>큰 따옴표:&quot;</li>
    <li>작음 부등호:&lt;</li>
    <li>큼 부등호:&gt;</li>
    <li>앤퍼샌트:&amp;</li>
    <li>저작권 기호:&copy;</li>
  </ul>
</body>
</html>
